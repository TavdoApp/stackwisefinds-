name: StakDock Candidate Discovery & Cloudflare Pages Deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Discover Tool Candidates for Editorial Review
        run: node scripts/autoIngestNewTools.cjs

      - name: Auto-Qualify High-Confidence Tool Candidates
        run: node scripts/qualifyAndPublishTools.cjs

      - name: Collect Reddit Research Drafts for Editorial Review
        run: node scripts/mineRedditQuestions.cjs

      - name: Rebuild SEO Sitemap
        run: node scripts/generateSitemap.cjs

      - name: Ping Search Engines (Bing & IndexNow)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/pingIndexNow.cjs

      - name: Build Production Bundle
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN1 || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # This is the existing Cloudflare Pages project identifier; the public canonical domain is stakdock.com.
        run: npx wrangler pages deploy dist --project-name=stackwisefinds

      - name: Commit Editorial Queues and Generated Sitemap
        run: |
          git config --global user.name "StakDock Bot"
          git config --global user.email "bot@stakdock.com"
          git add data/ingestion-candidates.json data/auto-published-tools.json data/reddit-content-drafts.json public/sitemap.xml
          git commit -m "auto(ingest): qualify tools and collect editorial drafts [skip ci]" || echo "No changes to commit"
          git push