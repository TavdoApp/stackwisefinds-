name: StakDock Candidate Discovery & Cloudflare Pages Deploy

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      # Auto-Approve Live Founder Submissions (Strict Domain & SSL Health Checks)
      - name: Auto-Approve Live Founder Submissions
        run: node scripts/autoApproveSubmissions.cjs

      # Curate & Publish Verified Trending SEO Tools (Strict 4-Step Probe)
      - name: Curate Verified Trending SEO Tools
        run: node scripts/curateTrendingTools.cjs

      - name: Generate Static Answer Pages
        run: node scripts/generateAnswerPages.cjs

      - name: Monitor Tool & Page Health (Quarantine Failures)
        run: node scripts/monitorToolHealth.cjs

      - name: Sync Real Domain Authority Scores (OpenPageRank API)
        env:
          OPENPAGERANK_API_KEY: ${{ secrets.OPENPAGERANK_API_KEY }}
        run: node scripts/fetchOpenPageRank.cjs

      - name: Rebuild SEO Sitemap
        run: node scripts/generateSitemap.cjs

      - name: Ping Search Engines (Bing & IndexNow)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/pingIndexNow.cjs

      - name: Build Production Bundle
        run: npm run build

      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN1 || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=stackwisefinds || echo "Cloudflare Pages deployment skipped in CI runner"

      - name: Commit Editorial Queues and Generated Sitemap
        continue-on-error: true
        run: |
          git config --global user.name "StakDock Bot"
          git config --global user.email "bot@stakdock.com"
          git add data/ingestion-candidates.json data/auto-published-tools.json data/openpagerank-cache.json data/reddit-content-drafts.json data/auto-published-answers.json public/sitemap.xml
          git commit -m "auto(ingest): collect candidates, health-check, and publish answer guides [skip ci]" || echo "No changes to commit"
          git push || echo "Git push skipped"