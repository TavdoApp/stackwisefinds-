name: Serverless Auto-Ingestion Engine & Cloudflare Pages Deploy

on:
  schedule:
    # Runs daily at midnight UTC (0% VPS usage)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Serverless Tool Auto-Ingester
        run: node scripts/autoIngestNewTools.cjs

      - name: Run Reddit AEO/GEO Question Miner & Article Generator
        run: node scripts/mineRedditQuestions.cjs

      - name: Rebuild SEO Sitemap
        run: node scripts/generateSitemap.cjs

      - name: Ping Search Engines (Bing & IndexNow)
        run: node scripts/pingIndexNow.cjs || true

      - name: Build Production Bundle
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: stackwisefinds
          directory: dist
          gitToPagesmapping: true

      - name: Commit Updated Dataset & Reddit Articles Back to GitHub Repository
        run: |
          git config --global user.name "Stackwise Bot"
          git config --global user.email "bot@stackwisefinds.com"
          git add src/data/saasData.jsx src/data/articlesData.js public/sitemap.xml
          git commit -m "auto(ingest): auto-ingest new tools and generate Reddit buyer guides [skip ci]" || echo "No changes to commit"
          git push
